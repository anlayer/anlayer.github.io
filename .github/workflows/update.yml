name: 每日热点自动更新

on:
  schedule:
    # GitHub Actions 的 cron 使用 UTC；每小时整点执行一次（实际可能延迟数分钟）
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取新闻并生成热点页面
        run: python generate.py

      - name: 提交并推送更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.html
          if git diff --cached --quiet; then
            echo "本次抓取内容与线上一致，无需提交"
          else
            git commit -m "自动更新热点页 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
